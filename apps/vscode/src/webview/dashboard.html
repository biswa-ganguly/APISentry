<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APISentry IDE Preview</title>
  <style>
    /* STYLES_INJECT_PLACEHOLDER */
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <!-- LOGO_INJECT_PLACEHOLDER -->
      <div class="title-box">
        <div class="title">APISentry IDE Dashboard</div>
        <div class="subtitle">Real-time Static API Contract Guard</div>
      </div>
    </div>
    <div class="controls">
      <select id="fixtureSelect" onchange="runPresetScan(this.value)">
        <!-- PRESETS_INJECT_PLACEHOLDER -->
      </select>
      <button class="btn" onclick="scan()">Analyze Workspace Now</button>
    </div>
  </div>

  <div class="metrics">
    <div class="metric-card">
      <div class="metric-label">Files Analyzed</div>
      <div class="metric-val"><!-- FILES_VAL --></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Frontend Callers</div>
      <div class="metric-val"><!-- CONSUMERS_VAL --></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Backend Endpoints</div>
      <div class="metric-val"><!-- PROVIDERS_VAL --></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Contract Errors</div>
      <div class="metric-val error"><!-- ERRORS_VAL --></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Contract Warnings</div>
      <div class="metric-val warning"><!-- WARNINGS_VAL --></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-title">
        <span>Discovered Endpoints</span>
        <span style="font-size:0.8rem; color:var(--text-muted); font-weight:600;"><!-- ENDPOINTS_COUNT --></span>
      </div>
      <input type="text" class="search-input" placeholder="Filter endpoints..." oninput="filterEndpoints(this.value)">
      <div id="endpointList" style="display:flex; flex-direction:column; gap:8px;">
        <!-- ENDPOINTS_LIST_INJECT -->
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">
        <span>Contract Issues & Correct Schemas</span>
        <span style="font-size:0.8rem; color:var(--text-muted); font-weight:600;"><!-- ISSUES_COUNT --></span>
      </div>

      <!-- ISSUES_LIST_INJECT -->
    </div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();

    function scan() {
      const select = document.getElementById('fixtureSelect');
      vscode.postMessage({ command: 'scanWorkspace', fixture: select ? select.value : '' });
    }

    function runPresetScan(val) {
      vscode.postMessage({ command: 'scanWorkspace', fixture: val });
    }

    function openFile(filePath, line, column) {
      vscode.postMessage({ command: 'openFile', filePath, line, column });
    }

    function filterEndpoints(q) {
      const items = document.querySelectorAll('.endpoint-item');
      items.forEach(item => {
        item.style.display = item.innerText.toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none';
      });
    }
  </script>
</body>
</html>
